<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <link rel="stylesheet" href="VoF.css">
</head>
<body>
    <h1>Test Solucion</h1>
    <br>
    <p>Piensa bien en las respuestas a cada pregunta, pues una vez hagas clic en verdadero o falso no podras volver a responder</p>
    <br>
    <p id="andalucia">En Andalucía hace mucho calor en verano</p>
    <button id="verdadero-andalucia" class="andalucia, verdadero" onclick="cont++; verdadero++">Verdadero</button>
    <button id="falso-andalucia" class="andalucia, falso" onclick="cont++; falso++">Falso</button>
    <br>
    <br>
    <p id="barca">El Barça tiene mas Copas de Europa que el Real Madrid</p>
    <button id="verdadero-barca" class="barca, verdadero" onclick="cont++; verdadero++">Verdadero</button>
    <button id="falso-barca" class="barca, falso" onclick="cont++; falso++">Falso</button>
    <br>
    <br>
    <p id="java">Este ejercicio esta usando JavaScript</p>
    <button id="verdadero-java" class="java, verdadero" onclick="cont++; verdadero++">Verdadero</button>
    <button id="falso-java" class="java, falso" onclick="cont++; falso++">Falso</button>
    <br>
    <br>
    <button onclick="if (cont < 3) {
                        alert('El numero de respuestas marcadas son: ' + cont + '. Debe responder todas para poder enviar');
                        verdadero=0;
                        falso=0;
                        cont=0;
                    } else if (cont > 3) { 
                        alert('Te has pasado de la raya repitelo anda');
                        verdadero=0;
                        falso=0;
                        cont=0;
                    } else {
                        alert('El numero de aciertos de: ' + verdadero);
                        verdadero = 0;
                        falso = 0;
                        let res = window.confirm('Haga clic en Aceptar para ver los resultados de sus test o pulse Cancelar para ver las soluciones'); 
                        cont = 0;
                    }">Enviar</button>
    <button onclick="location.reload()">Reiniciar</button>
    <script src="VoF.js"></script>
</body>
</html>
